<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06 - Objects</title>
    <link rel="stylesheet" href="../src/css/04-js.css">
    
</head>
<body>
    <main class="document-page"> 
        <a href="./index.html" class="boton-volver">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#000000" viewBox="0 0 256 256" >
                <path
                    d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z">
                </path>
            </svg>
        </a>
        <header>
            <h1>06 - Type - Objects</h1>
            <h2>Comprende y trabaja con diferentes tipos de objetos.</h2>
        </header>
        <section>
            <ul class="objects"></ul>

            
        </section>
    </main>
    <script>
        //elements
        const objs = document.querySelector('.objects');

        //Object String
        const string = new String('Javascript ❤️');
        objs.innerHTML = `<li>${string} --> Object:
                              ${string.constructor.name}</li>`;

        //Object Number
        const number = new Number(256);
        objs.innerHTML += `<li> ${number} --> Object:
                                ${number.constructor.name}</li>`;
                                
        //Object Boolean
        const bool = new Boolean(512>128);
        objs.innerHTML += `<li> ${bool} --> Object:
                                ${bool.constructor.name}</li>`;

        //Object Date
        const dt = new Date('12/12/2026');
        objs.innerHTML += `<li> ${dt.getFullYear()} -> Object: 
                                ${dt.constructor.name} </li>`;

        //Object Object
        const obj = new Object('Vehicle');
        objs.innerHTML += `<li> ${obj} -> Object: 
                                ${obj.constructor.name} </li>`;

    </script>
                
    
</body>
</html>
