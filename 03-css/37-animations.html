<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37 - Animations</title>
    <link rel="stylesheet" href="../src/css/03-css.css">
</head>
<style>
    main section {
        display: flex;
        flex-direction: column;
        align-items: center;


        div.jungle {
            background: url(../03-css/img/jungle.png) no-repeat center;
            border-radius: 4px;
            margin-block: 2rem;
            position: relative;
            height: 471px;
            width: 380px;
            img {
                border-radius: 0;
                border: none;
                position: absolute;
            }
            img.logo {
                top: 35px;
                left: 30px;
                height: 72px;
                objec-fit: contain;
                z-index: 9;
                width: 317px;
                animation: 2s animLogo ease-in infinite;
            }
        }
    }
    @keyframes animLogo {
        0%, 100% {
            transform: scale(1)
        }
        50% {
            transform: scale(1.2)
        }
    }
</style>
<body>
    <main class="document-page"> 
        <a href="../03-css/index.html" class="boton-volver">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#000000" viewBox="0 0 256 256" >
                <path
                    d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z">
                </path>
            </svg>
        </a>
        <header>
            <h1>37 - Animations</h1>
            <h2>Lets an element gradually change from one style to another.</h2>
        </header>
        <section>
            <div class="jungle">
                <img src="../03-css/img/logo-dk.png" alt="" class="logo">
                <img src="../03-css/img/dk.png" alt="" class="dk">
                <div class="move">
                    <img src="../03-css/img/ryno.png" alt="" class="ryno">
                </div>
            </div>
            
        </section>
    </main>
</body>
</html>
