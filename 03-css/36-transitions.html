<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36 - transitions</title>
    <link rel="stylesheet" href="../src/css/03-css.css">
</head>
<style>
    main section {
        display: flex;
        flex-direction: column;
        align-items: center;
        
        img {
            border: none;
            border-radius: 0;
            filter: drop-shadow(0 0 12px #fff);
            width: 250px;    /* <--- aumenta este valor */
            height: auto;    /* <--- mantiene la proporción */
        }
        img.transition01 {
            transition: transform 0.5s ease-in;
            &:hover {
                transform: scale(1.3);
            }
        }
        img.transition02 {
            transition: transform 0.5s ease-out;
            &:hover {
                transform: rotate(-0.5turn);
            }
        }
        img.transition03 {
            transition: transform 0.5s ease-in-out;
            &:hover {
                transform: rotateY(180deg);
            }
        }
        img.transition04 {
            transition: transform 0.5s linear;
            &:hover {
                transform: translateX(80px);
            }
        }
        div.box {
            background-color: #fff;
            height: 80px;
            margin-block: 2rem;
            width: 80px;
            transition: width 1s,
                        height 1s 1s,
                        background-color 2s 1s;
            &:hover {
                background-color: #f00;
                width: 300px;
                height: 160px;
            }
        }
    }
</style>
<body>
    <main class="document-page"> 
        <a href="../03-css/index.html" class="boton-volver">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#000000" viewBox="0 0 256 256" >
                <path
                    d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z">
                </path>
            </svg>
        </a>
        <header>
            <h1>36- Transitions</h1>
            <h2>Enable you to define the transition between two states of an element..</h2>
        </header>
        <section>
            <h3>Scale(1.3)</h3>
            <img class="transition01" src="../03-css/img/dk.png"  alt="DK">
            <h3>Rotate(-180deg):</h3>
            <img class="transition02" src="../03-css/img/dk.png" alt="DK">
            <h3>RotateY(180deg):</h3>
            <img class="transition03" src="../03-css/img/dk.png" alt="DK">
            <h3>TranslateX(100px):</h3>
            <img class="transition04" src="../03-css/img/dk.png" alt="DK">
            <h3>Multiple:</h3>
            <div class="box"></div>
        </section>
    </main>
</body>
</html>
