<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26 - Border Radius</title>
    <link rel="stylesheet" href="../src/css/03-css.css">
    
   
    <style>
       
        .box {
            width: 200px;
            height: 200px;
            background-color: #3b3f4279;
            border: 3px solid #000;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 18px;
        }

       
        .radius-1 {
            border-radius: 0 140px 0 0;
        }

        
        .radius-2 {
            border-radius: 0 140px 0 140px;
        }

      
        .radius-3 {
            border-radius: 0 0 0 140px;
        }

        
        .circulo {
            width: 200px;
            height: 200px;
            background-color: #3b3f4279;
            border-radius: 50%;  
            border: 3px solid rgb(0, 0, 0);
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <main class="document-page"> 
        <a href="../03-css/index.html" class="boton-volver">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#000000" viewBox="0 0 256 256" >
                <path d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path>
            </svg>
        </a>
        <header>
            <h1>26 - Border Radius</h1>
            <h2>Property defines the radius of the element's corners.</h2>
        </header>
        
        <section>
            <h3>Border-Radius: 50% </h3>
            <div class="circulo"></div>
            
            <h3>Border-Radius: 0 140px 0 0</h3>
            <div class="box radius-1"></div>
            
            <h3>Border-Radius: 0 140px 0 140px</h3>
            <div class="box radius-2"></div>
            
            <h3>Border-Radius: 0 0 0 140px</h3>
            <div class="box radius-3"></div>
        </section>
    </main>
</body>
</html>
